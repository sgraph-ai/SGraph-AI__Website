name: CI Pipeline (Base)

# Reusable pipeline for sgraph.ai website. Mirrors the SGraph-AI__App__Send
# pipeline pattern: one reusable workflow + per-branch dispatchers.
#
# Steps:
#   1. increment-tag       — bumps the git tag (and version file) on dev/main
#   2. check-aws-credentials — gates the deploy job on required secrets
#   3. deploy              — runs sgraph_ai_website__deploy/deploy_static_site.py
#                            against S3 + CloudFront for the target environment

on:
  workflow_call:
    inputs:
      git_branch:
        required: true
        type: string
      release_type:
        required: false
        type: string
        default: ""
      should_increment_tag:
        required: false
        type: boolean
        default: false
      target_deploy:
        required: true
        type: string
    secrets:
      AWS_ACCESS_KEY_ID:
        required: false
      AWS_SECRET_ACCESS_KEY:
        required: false
      AWS_ACCOUNT_ID:
        required: false
      AWS_DEFAULT_REGION:
        required: false
      WEBSITE_CF_DIST:
        required: false
      WEBSITE_CF_DIST_MAIN:
        required: false
      WEBSITE_CF_DIST_QA:
        required: false

env:
  # latest/ on S3 mirrors the active IFD line (v0.2.x). Older versions under
  # sgraph_ai_website/v0/ (e.g. v0.1.x) live in git as historical archives only
  # and are NOT uploaded by this pipeline.
  WEBSITE_DIR : sgraph_ai_website/v0/v0.2/v0.2.0
  SITE_NAME   : sgraph-ai
  PACKAGE_NAME: sgraph_ai_website

# Least-privilege default for the GITHUB_TOKEN; jobs that need more opt in
# explicitly below (security review: CR-03).
permissions:
  contents: read

jobs:
  # ── Pre-deploy gate: render the edge representations against the live vault ──
  # Catches a broken orchestrator / manifest before anything reaches CloudFront.
  # No AWS needed — imports the repo's orchestrator and renders real content.
  edge-render-test:
    name: Edge-render smoke (gating)
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_branch }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Render llms.txt + a markdown + a llm.json page
        run: |
          set -e
          node tests/edge-render/run-local.mjs /llms.txt                                   > /dev/null
          node tests/edge-render/run-local.mjs /en-gb/library/building-on-sgraph.md        > /dev/null
          node tests/edge-render/run-local.mjs /en-gb/library/building-on-sgraph.llm.json  > /dev/null
          echo "edge-render smoke passed"

  increment-tag:
    name: Increment Tag
    runs-on: ubuntu-latest
    permissions:
      contents: write          # pushes the bumped tag + version file
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_branch }}

      - name: Increment Tag
        if: inputs.should_increment_tag
        # Pinned to a commit SHA (was @dev, a mutable branch) — CR-03.
        uses: owasp-sbot/OSBot-GitHub-Actions/.github/actions/git__increment-tag@c2af482d73aaad222f7e6b091d35ab1e5c116f3b # v0.14.33
        with:
          release_type: ${{ inputs.release_type }}

  check-aws-credentials:
    name: Check AWS Credentials
    runs-on: ubuntu-latest
    outputs:
      has-credentials: ${{ steps.check.outputs.has-credentials }}
    steps:
      - id: check
        run: |
          if [[ -n "${{ secrets.AWS_ACCESS_KEY_ID }}" ]] && \
             [[ -n "${{ secrets.AWS_SECRET_ACCESS_KEY }}" ]] && \
             [[ -n "${{ secrets.AWS_ACCOUNT_ID }}" ]] && \
             [[ -n "${{ secrets.AWS_DEFAULT_REGION }}" ]]; then
            echo "has-credentials=true" >> $GITHUB_OUTPUT
            echo "AWS credentials configured"
          else
            echo "has-credentials=false" >> $GITHUB_OUTPUT
            echo "AWS credentials missing — deploy job will be skipped"
          fi

  deploy:
    if: needs.check-aws-credentials.outputs.has-credentials == 'true'
    name: "Deploy to S3 + CloudFront (${{ inputs.target_deploy }})"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [edge-render-test, increment-tag, check-aws-credentials]
    permissions:
      contents: write          # git__update_branch fast-forwards the tag bump
    environment: ${{ inputs.target_deploy }}
    concurrency:
      group: "website-deploy-${{ inputs.target_deploy }}"
      cancel-in-progress: false
    steps:
      # ref pins the checkout to the dispatched branch. Without this, a PROD
      # dispatch (which passes git_branch: 'main') would deploy whatever ref the
      # workflow was launched from (security review: CR-03).
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_branch }}

      - name: Git Update Current Branch
        if: inputs.should_increment_tag
        # Pinned to a commit SHA (was @dev, a mutable branch) — CR-03.
        uses: owasp-sbot/OSBot-GitHub-Actions/.github/actions/git__update_branch@c2af482d73aaad222f7e6b091d35ab1e5c116f3b # v0.14.33

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id     : ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key : ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region            : ${{ secrets.AWS_DEFAULT_REGION }}

      - name: Read version
        id: version
        run: echo "version=$(cat sgraph_ai_website/version)" >> "$GITHUB_OUTPUT"

      # Locale generation is paused while the v0.2.x English content is still
      # being finalised. The i18n/*.json translations were written for the v0.1
      # route set (homepage / product / agents / pricing tiers / payment / etc.)
      # and do not yet cover the v0.2 layout — running the generator now would
      # produce partial / misleading localisations. The script, the translation
      # JSON files, and the locale .gitignore entries all stay in the repo. To
      # re-enable once v0.2 translations exist, uncomment the two lines below.
      #
      # - name: Generate i18n locale pages
      #   run: python sgraph_ai_website__deploy/generate_i18n_pages.py

      - name: Resolve deployment environment
        id: env
        run: |
          DEPLOY_ENV="${{ inputs.target_deploy }}"
          if [ "$DEPLOY_ENV" == "prod" ] || [ "$DEPLOY_ENV" == "production" ]; then
            echo "deploy_env=prod"           >> $GITHUB_OUTPUT
            echo "smoke_url=https://sgraph.ai" >> $GITHUB_OUTPUT
            echo "Deploying to PRODUCTION (sgraph.ai) → S3: websites/sgraph-ai/prod/"
          elif [ "$DEPLOY_ENV" == "main" ]; then
            echo "deploy_env=main"                  >> $GITHUB_OUTPUT
            echo "smoke_url=https://main.sgraph.ai" >> $GITHUB_OUTPUT
            echo "Deploying to MAIN → S3: websites/sgraph-ai/main/"
          elif [ "$DEPLOY_ENV" == "qa" ]; then
            echo "deploy_env=qa"                  >> $GITHUB_OUTPUT
            echo "smoke_url=https://qa.sgraph.ai" >> $GITHUB_OUTPUT
            echo "Deploying to QA → S3: websites/sgraph-ai/qa/"
          else
            echo "deploy_env=dev"                  >> $GITHUB_OUTPUT
            echo "smoke_url=https://dev.sgraph.ai" >> $GITHUB_OUTPUT
            echo "Deploying to DEV → S3: websites/sgraph-ai/dev/"
          fi

      - name: Generate static API
        run: |
          python sgraph_ai_website__deploy/generate_static_api.py \
            --source-dir  ${{ env.WEBSITE_DIR }} \
            --deploy-env  ${{ steps.env.outputs.deploy_env }} \
            --version     ${{ steps.version.outputs.version }} \
            --commit-sha  ${{ github.sha }} \
            --branch      ${{ github.ref_name }} \
            --site        ${{ env.SITE_NAME }}

      - name: Deploy static site
        run: |
          DEPLOY_ENV="${{ steps.env.outputs.deploy_env }}"
          if [ "$DEPLOY_ENV" == "qa" ]; then
            CF_ARGS="--cloudfront-distribution-id ${{ secrets.WEBSITE_CF_DIST_QA }}"
          else
            CF_ARGS="--cloudfront-distribution-id ${{ secrets.WEBSITE_CF_DIST }} ${{ secrets.WEBSITE_CF_DIST_MAIN }}"
          fi
          python sgraph_ai_website__deploy/deploy_static_site.py \
            --site        ${{ env.SITE_NAME }} \
            --version     ${{ steps.version.outputs.version }} \
            --source-dir  ${{ env.WEBSITE_DIR }} \
            --account-id  ${{ secrets.AWS_ACCOUNT_ID }} \
            --region      ${{ secrets.AWS_DEFAULT_REGION }} \
            --deploy-env  ${{ steps.env.outputs.deploy_env }} \
            $CF_ARGS \
            --smoke-test-url "${{ steps.env.outputs.smoke_url }}" \
            --version-file sgraph_ai_website/version

      - name: Store CI artifacts
        run: |
          python sgraph_ai_website__deploy/store_ci_artifacts.py \
            --version ${{ steps.version.outputs.version }} \
            --account-id ${{ secrets.AWS_ACCOUNT_ID }} \
            --region ${{ secrets.AWS_DEFAULT_REGION }} \
            --site ${{ env.SITE_NAME }}

  # ── Post-deploy end-to-end check against the freshly deployed environment ──
  # Runs for qa + dev (the promotion gates). A red here blocks promotion. Prod
  # is left out so production deploys stay fast (it has already passed on main).
  e2e:
    name: "E2E (${{ inputs.target_deploy }})"
    if: needs.deploy.result == 'success' && (inputs.target_deploy == 'qa' || inputs.target_deploy == 'dev')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    needs: deploy
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_branch }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright + Chromium
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Run vault-content e2e
        env:
          SG_BASE_URL: ${{ inputs.target_deploy == 'dev' && 'https://dev.sgraph.ai' || 'https://qa.sgraph.ai' }}
        run: node tests/e2e/qa-vault-content.spec.js
