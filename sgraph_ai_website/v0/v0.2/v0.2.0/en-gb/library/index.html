<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Library — sgraph.ai</title>
  <base href="/en-gb/library/">
  <link rel="icon"       href="../../_common/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap">
  <link rel="stylesheet" href="../../_common/fonts/fonts.css">
  <link rel="stylesheet" href="../../_common/css/style.css">

  <script type="importmap">
  {
    "imports": {
      "/core/vault-client/v1/v1.2/v1.2.2/sg-vault-client.js":
          "https://dev.tools.sgraph.ai/core/vault-client/v1/v1.2/v1.2.2/sg-vault-client.js"
    }
  }
  </script>

  <script src="../../_common/js/sg-vault-cache.js"></script>
  <script type="module" src="../../_common/js/components/sg-article-viewer/v0/v0.1/v0.1.0/sg-article-viewer.js"></script>
  <script type="module" src="../../_common/js/components/sg-search/v0/v0.1/v0.1.0/sg-search.js"></script>
</head>
<body class="sub-site-page">

<!-- ═══ PERSISTENT HEADER ════════════════════════════════════ -->
<sg-site-header site="Send">
  <div slot="locale" id="locale-picker"></div>
</sg-site-header>

<!-- Gap between dark site header and light sub-site shell -->
<div class="sub-site-gap"></div>

<!-- ═══ LIBRARY SUB-SITE BAND ════════════════════════════════ -->
<!--
  Vault: pmcv9tfe  |  nav resolved at runtime via tree walk: library/_nav.json
  (Approach A — no hardcoded nav-object-id; vault-client v1.2.2 resolves HEAD → tree → blob_id)
-->
<sg-sub-nav
  site-title="Library"
  site-description="A growing public knowledge base. How sgraph.ai delivers content from encrypted vaults — the cryptography, the components, and the trust boundaries."
  vault-id="pmcv9tfe"
  read-key="dJKFnqa4Ckip-XpsbkfxV4f7PJhkp0FkVPaYqJbyUMw"
  nav-path="library/_nav.json">
</sg-sub-nav>

<!-- ═══ THREE-COLUMN SHELL ════════════════════════════════════ -->
<!--
  Col 1: sg-side-nav (sticky file-tree)
  Col 2: landing page OR article content
  Col 3: article TOC (hidden on landing, shown with .with-toc class when article has headings)
-->
<div class="sub-site" id="sub-site-shell">

  <!-- Left column: search bar + nav tree -->
  <div class="sub-site__sidebar">
    <div class="sub-site__search-bar">
      <sg-search
        id="sg-search"
        root-url="/en-gb/library/search/root.json"
        vault-id="pmcv9tfe"
        read-key="dJKFnqa4Ckip-XpsbkfxV4f7PJhkp0FkVPaYqJbyUMw"
        placeholder="Search library…">
      </sg-search>
    </div>
    <sg-side-nav
      vault-id="pmcv9tfe"
      read-key="dJKFnqa4Ckip-XpsbkfxV4f7PJhkp0FkVPaYqJbyUMw"
      nav-path="library/_nav.json"
      tree-label="Library"
      version="v0.2.0"
      home-href="/en-gb/library/"
      auto-select
      extra-links="[
        {&quot;section&quot;:&quot;Blog&quot;,&quot;title&quot;:&quot;Introducing @Journalist&quot;,&quot;slug&quot;:&quot;blog/introducing-journalist&quot;,&quot;object_id&quot;:&quot;obj-cas-imm-684e59d65e77a25d6846245eee2291e9a1767860ef80dcb6351e4e78607ad123&quot;,&quot;vault_id&quot;:&quot;d3o9s0ff&quot;,&quot;read_key&quot;:&quot;nvm8rNKlduEPcu_7NecGTqCeDLiVoTCSSNapIJ-uOMI&quot;,&quot;render&quot;:&quot;markdown&quot;},
        {&quot;section&quot;:&quot;Blog&quot;,&quot;title&quot;:&quot;Agentics London Session&quot;,&quot;slug&quot;:&quot;blog/agentics-london-session&quot;,&quot;object_id&quot;:&quot;obj-cas-imm-77c47abb9be86ebfcd7f826f275856f8849914377aa9dab015145c1a9af1cf8e&quot;,&quot;vault_id&quot;:&quot;d3o9s0ff&quot;,&quot;read_key&quot;:&quot;nvm8rNKlduEPcu_7NecGTqCeDLiVoTCSSNapIJ-uOMI&quot;,&quot;render&quot;:&quot;markdown&quot;},
        {&quot;section&quot;:&quot;What&#39;s New&quot;,&quot;title&quot;:&quot;Team Expansion — Seven Agents&quot;,&quot;slug&quot;:&quot;whats-new/team-expansion-seven-agents&quot;,&quot;object_id&quot;:&quot;obj-cas-imm-f678dd3857795479a88c8064c138330732c9ff2ee9ed8d4782904af861847355&quot;,&quot;vault_id&quot;:&quot;d3o9s0ff&quot;,&quot;read_key&quot;:&quot;nvm8rNKlduEPcu_7NecGTqCeDLiVoTCSSNapIJ-uOMI&quot;,&quot;render&quot;:&quot;markdown&quot;}
      ]">
    </sg-side-nav>
  </div>

  <!-- Loading state — shown while nav/vault cold-starts, hidden after nav:loaded -->
  <div class="sub-site__loading" id="loading-state">
    <div class="sg-loading">
      <div class="sg-loading__spinner" aria-hidden="true"></div>
      <p class="sg-loading__title">Loading library…</p>
      <p class="sg-loading__sub" id="loading-sub">Connecting to vault</p>
    </div>
  </div>

  <!-- Landing page — shown at /en-gb/library/ (no article selected) -->
  <div class="sub-site__landing" id="landing" hidden>
    <p class="sub-site__landing-eyebrow">sgraph.ai / Library</p>
    <h1 class="sub-site__landing-title">Library</h1>
    <p class="sub-site__landing-desc">Technical knowledge base — how sgraph.ai works, the underlying concepts, security model, and integration guides.</p>
    <div class="sub-site__section-cards" id="landing-sections"></div>
    <p class="sub-site__landing-stats" id="landing-stats" hidden></p>
  </div>

  <!-- Article content — shown when an article is selected -->
  <div class="sub-site__content" id="article-content" hidden>
    <div class="sub-site__crumbs" id="article-crumbs"></div>
    <div id="article-render"></div>
    <div class="sub-site__next-prev" id="next-prev"></div>
  </div>

  <!-- Right TOC — built from rendered article headings, hidden until populated -->
  <div class="sub-site__toc" id="article-toc" hidden>
    <button class="sub-site__toc-toggle" id="toc-toggle" title="Toggle table of contents"></button>
    <div class="sub-site__toc-label">On this page</div>
    <ul class="sub-site__toc-list" id="toc-list"></ul>
  </div>

</div>

<footer class="sub-site-footer">
  <span class="sub-site-footer__copy">© 2026 SGraph AI Ltd.</span>
  <span class="sub-site-footer__meta">sgraph.ai/library · site v0.2.0 · nav: dynamic (library/_nav.json)</span>
</footer>

<sg-debug-panel></sg-debug-panel>
<script type="module" src="../../_common/js/components/sg-debug-panel/v0/v0.1/v0.1.0/sg-debug-panel.js"></script>

<script type="module">
  // Shared sub-site shell (CR-05). All routing/render logic lives in the module;
  // this page only supplies its identity.
  import { mountSubSite } from '../../_common/js/sub-site-shell.js';

  mountSubSite({
    base:      '/en-gb/library/',
    siteLabel: 'Library',
    vaultId:   'pmcv9tfe',
    readKey:   'dJKFnqa4Ckip-XpsbkfxV4f7PJhkp0FkVPaYqJbyUMw',
  });
</script>

<script src="../../_common/js/nav.js"></script>
<script>
  // Reload if browser restores page from bfcache (back/forward cache).
  // Prevents stale HTML shell being shown after navigation on mobile.
  window.addEventListener('pageshow', e => { if (e.persisted) location.reload(); });
</script>
<script type="module" src="../../_common/js/components/sg-site-header/v1/v1.0/v1.0.6/sg-site-header.js"></script>
<script type="module" src="../../_common/js/components/sg-sub-nav/v0/v0.1/v0.1.0/sg-sub-nav.js"></script>
<script type="module" src="../../_common/js/components/sg-side-nav/v0/v0.1/v0.1.0/sg-side-nav.js"></script>

</body>
</html>
