<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Library — sgraph.ai</title>
  <link rel="icon"        href="../../_common/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet"  href="../../_common/fonts/fonts.css">
  <link rel="stylesheet"  href="../../_common/css/style.css">

  <!--
    Cross-origin import map — rewrites bare /components/... paths to dev.tools.sgraph.ai.
    Must appear before any type="module" script.
    Production: replace every dev.tools.sgraph.ai with tools.sgraph.ai.
  -->
  <script type="importmap">
  {
    "imports": {
      "/components/base/v1/v1.0/v1.0.0/sg-component.js":
          "https://dev.tools.sgraph.ai/components/base/v1/v1.0/v1.0.0/sg-component.js",
      "/core/vault-client/v1/v1.2/v1.2.2/sg-vault-client.js":
          "https://dev.tools.sgraph.ai/core/vault-client/v1/v1.2/v1.2.2/sg-vault-client.js",
      "/core/markdown/v1/v1.0/v1.0.0/sg-markdown.js":
          "https://dev.tools.sgraph.ai/core/markdown/v1/v1.0/v1.0.0/sg-markdown.js",
      "/components/vault-embed/sg-vault-key/v0/v0.1/v0.1.0/events.js":
          "https://dev.tools.sgraph.ai/components/vault-embed/sg-vault-key/v0/v0.1/v0.1.0/events.js",
      "/components/vault-embed/sg-vault-key/v0/v0.1/v0.1.0/sg-vault-key.js":
          "https://dev.tools.sgraph.ai/components/vault-embed/sg-vault-key/v0/v0.1/v0.1.0/sg-vault-key.js",
      "/components/vault-embed/sg-vault-fetch/v0/v0.1/v0.1.0/sg-vault-fetch.js":
          "https://dev.tools.sgraph.ai/components/vault-embed/sg-vault-fetch/v0/v0.1/v0.1.0/sg-vault-fetch.js",
      "/components/vault-embed/sg-vault-trace/v0/v0.1/v0.1.0/sg-vault-trace.js":
          "https://dev.tools.sgraph.ai/components/vault-embed/sg-vault-trace/v0/v0.1/v0.1.0/sg-vault-trace.js",
      "/components/content/sg-content-markdown/v0/v0.1/v0.1.0/sg-content-markdown.js":
          "https://dev.tools.sgraph.ai/components/content/sg-content-markdown/v0/v0.1/v0.1.0/sg-content-markdown.js",
      "/components/content/sg-content-image/v0/v0.1/v0.1.0/sg-content-image.js":
          "https://dev.tools.sgraph.ai/components/content/sg-content-image/v0/v0.1/v0.1.0/sg-content-image.js",
      "/components/content/sg-content-json/v0/v0.1/v0.1.0/sg-content-json.js":
          "https://dev.tools.sgraph.ai/components/content/sg-content-json/v0/v0.1/v0.1.0/sg-content-json.js"
    }
  }
  </script>

  <script type="module"
    src="https://dev.tools.sgraph.ai/components/vault-embed/sg-vault-content/v0/v0.1/v0.1.0/sg-vault-content.js">
  </script>
</head>
<body>

<!-- ═══ PERSISTENT HEADER ════════════════════════════════════ -->
<sg-site-header site="Send">
  <div slot="locale" id="locale-picker"></div>
</sg-site-header>

<!-- ═══ LIBRARY SUB-SITE NAV ════════════════════════════════ -->
<!--
  Vault: bf31a13c78c9  |  nav object: obj-cas-imm-6f633eaebed4
  cross_links currently hardcoded; switch to vault src once nav JSON has cross_links key.
-->
<sg-sub-nav
  site-title="Library"
  links='[{"title":"Dev","href":"/en-gb/dev/"}]'>
</sg-sub-nav>

<main>
  <!--
    Sub-site shell: sg-side-nav (left) + article viewer (right)
    vault-id / nav-object-id set here for debug visibility.
    auto-select fires nav:select immediately on first render.
  -->
  <div class="sub-site"
       data-vault-id="bf31a13c78c9"
       data-nav-object-id="obj-cas-imm-6f633eaebed4">

    <sg-side-nav
      vault-id="bf31a13c78c9"
      read-key="s68J93Gx5pzmP4FGo682Ns3JQ0aKdtSVKCjQKtSS_GA"
      nav-object-id="obj-cas-imm-6f633eaebed4"
      auto-select>
    </sg-side-nav>

    <div class="sub-site__content" id="article-content"></div>

  </div>
</main>

<sg-site-footer></sg-site-footer>

<!--
  SPA routing + article loader
  URL pattern: /en-gb/library/{slug}/
  CloudFront rewrites any slug path to this index.html (url-rewrite.js).
  Slug is extracted from location.pathname and passed to sg-side-nav as active-slug.
-->
<script type="module">
  const VAULT_ID = 'bf31a13c78c9';
  const READ_KEY = 's68J93Gx5pzmP4FGo682Ns3JQ0aKdtSVKCjQKtSS_GA';

  function slugFromPath() {
    const segments = location.pathname.split('/').filter(Boolean);
    // /en-gb/library/ → 2 segments → no slug
    // /en-gb/library/two-agent-model/ → 3rd segment is slug
    return segments.length > 2 ? segments[2] : '';
  }

  const sideNav = document.querySelector('sg-side-nav');

  // Seed active-slug from URL before nav renders so auto-select picks the right article
  const initialSlug = slugFromPath();
  if (initialSlug) sideNav.setAttribute('active-slug', initialSlug);

  // Load article and update URL when nav item is selected (includes auto-select on load)
  document.addEventListener('nav:select', e => {
    const { slug, content_object_id, render } = e.detail;
    const targetPath = slug ? `/en-gb/library/${slug}/` : '/en-gb/library/';
    if (location.pathname !== targetPath) {
      history.pushState({ slug }, '', targetPath);
    }
    loadArticle(content_object_id, render ?? 'markdown');
  });

  // Restore article when browser navigates back/forward
  window.addEventListener('popstate', () => {
    const slug = slugFromPath();
    const btn = sideNav.querySelector(`.sg-side-nav__item[data-slug="${CSS.escape(slug)}"]`);
    if (btn) {
      btn.click();
    } else {
      // Nav not yet rendered; set active-slug so auto-select picks it up
      sideNav.setAttribute('active-slug', slug);
    }
  });

  function loadArticle(objectId, render) {
    const content = document.getElementById('article-content');
    content.innerHTML = '';
    content.setAttribute('data-object-id', objectId);
    const el = document.createElement('sg-vault-content');
    el.setAttribute('vault-id', VAULT_ID);
    el.setAttribute('read-key', READ_KEY);
    el.setAttribute('object-id', objectId);
    el.setAttribute('render', render);
    content.appendChild(el);
  }
</script>

<script src="../../_common/js/nav.js"></script>
<script type="module" src="../../_common/js/components/sg-site-header/v1/v1.0/v1.0.6/sg-site-header.js"></script>
<script type="module" src="../../_common/js/components/sg-site-footer/v1/v1.0/v1.0.0/sg-site-footer.js"></script>
<script type="module" src="../../_common/js/components/sg-sub-nav/v0/v0.1/v0.1.0/sg-sub-nav.js"></script>
<script type="module" src="../../_common/js/components/sg-side-nav/v0/v0.1/v0.1.0/sg-side-nav.js"></script>

</body>
</html>
