<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dev — sgraph.ai</title>
  <base href="/en-gb/dev/">
  <link rel="icon"       href="../../_common/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap">
  <link rel="stylesheet" href="../../_common/fonts/fonts.css">
  <link rel="stylesheet" href="../../_common/css/style.css">

  <script type="importmap">
  {
    "imports": {
      "/core/vault-client/v1/v1.2/v1.2.2/sg-vault-client.js":
          "https://dev.tools.sgraph.ai/core/vault-client/v1/v1.2/v1.2.2/sg-vault-client.js"
    }
  }
  </script>

  <script type="module" src="../../_common/js/components/sg-article-viewer/v0/v0.1/v0.1.0/sg-article-viewer.js"></script>
</head>
<body class="sub-site-page">

<!-- ═══ PERSISTENT HEADER ════════════════════════════════════ -->
<sg-site-header site="Send"></sg-site-header>

<!-- Gap between dark site header and light sub-site shell -->
<div class="sub-site-gap"></div>

<!-- ═══ DEV SUB-SITE BAND ════════════════════════════════════ -->
<!--
  Nav: nav.json (static, served from repo) — articles from status vault 1lfehfjh
-->
<sg-sub-nav
  site-title="Dev"
  site-description="Developer documentation — agent workflow, vault architecture, and project status."
  src="nav.json">
</sg-sub-nav>

<!-- ═══ THREE-COLUMN SHELL ════════════════════════════════════ -->
<!--
  Col 1: sg-side-nav (sticky file-tree)
  Col 2: landing page OR article content
  Col 3: article TOC (hidden on landing, shown with .with-toc class when article has headings)
  Non-SPA sub-pages (vault-peek, workstreams, agents, decisions) have href in the nav
  JSON so they render as <a> tags and navigate directly without firing nav:select.
-->
<div class="sub-site" id="sub-site-shell">

  <sg-side-nav
    src="nav.json"
    tree-label="Dev"
    version="v0.2.0"
    extra-links='[{"section":"Tools","title":"Open Vaults Directory","href":"/en-gb/dev/vaults/","slug":"vaults"},{"section":"Tools","title":"CI / GitHub Actions","slug":"ci","object_id":"__ci__"},{"section":"Status","title":"Workstreams","slug":"status/workstreams","object_id":"obj-cas-imm-32aa32595ec4","vault_id":"1lfehfjh","read_key":"gYfzgJ5mlhn4pMgSdGcB1oASjETpPB7jVhaF0QQ3uUs","render":"json"},{"section":"Status","title":"Issues","slug":"status/issues","object_id":"obj-cas-imm-da66557cad10","vault_id":"1lfehfjh","read_key":"gYfzgJ5mlhn4pMgSdGcB1oASjETpPB7jVhaF0QQ3uUs","render":"json"},{"section":"Status","title":"Agents","slug":"status/agents","object_id":"obj-cas-imm-652a31e21300","vault_id":"1lfehfjh","read_key":"gYfzgJ5mlhn4pMgSdGcB1oASjETpPB7jVhaF0QQ3uUs","render":"json"}]'
    home-href="/en-gb/dev/"
    auto-select>
  </sg-side-nav>

  <!-- Landing page — shown at /en-gb/dev/ (no article selected) -->
  <div class="sub-site__landing" id="landing" hidden>
    <p class="sub-site__landing-eyebrow">sgraph.ai / Dev</p>
    <h1 class="sub-site__landing-title">Dev</h1>
    <p class="sub-site__landing-desc">Developer documentation — the two-agent operating model, Email-FS protocol, vault architecture, and agent onboarding guides.</p>
    <div class="sub-site__section-cards" id="landing-sections"></div>
  </div>

  <!-- Article content — shown when an article is selected -->
  <div class="sub-site__content" id="article-content" hidden>
    <div class="sub-site__crumbs" id="article-crumbs"></div>
    <div id="article-render"></div>
    <div class="sub-site__next-prev" id="next-prev"></div>
  </div>

  <!-- Right TOC — built from rendered article headings, hidden until populated -->
  <div class="sub-site__toc" id="article-toc" hidden>
    <div class="sub-site__toc-label">On this page</div>
    <ul class="sub-site__toc-list" id="toc-list"></ul>
  </div>

</div>

<footer class="sub-site-footer">
  <span class="sub-site-footer__copy">© 2026 SGraph AI Ltd.</span>
  <span class="sub-site-footer__meta" id="footer-meta">sgraph.ai/dev · site v0.2.0 · status vault 1lfehfjh</span>
</footer>

<sg-debug-panel></sg-debug-panel>
<script type="module" src="../../_common/js/components/sg-debug-panel/v0/v0.1/v0.1.0/sg-debug-panel.js"></script>

<script type="module">
  const VAULT_ID = '1lfehfjh';
  const READ_KEY = 'gYfzgJ5mlhn4pMgSdGcB1oASjETpPB7jVhaF0QQ3uUs';

  function slugFromPath() {
    const segments = location.pathname.split('/').filter(Boolean);
    return segments.length > 2 ? segments.slice(2).join('/') : '';
  }

  function toSlug(title) {
    return title.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/, '');
  }

  const escH = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

  const shell      = document.getElementById('sub-site-shell');
  const sideNav    = document.querySelector('sg-side-nav');
  const landing    = document.getElementById('landing');
  const articleEl  = document.getElementById('article-content');
  const articleToc = document.getElementById('article-toc');

  // Restore panel collapse state — default collapsed on mobile (≤900px)
  const _savedNav = localStorage.getItem('sg-nav-collapsed');
  if (_savedNav === 'true' || (_savedNav === null && window.innerWidth <= 900)) {
    shell.classList.add('nav-collapsed');
  }

  let allArticles = [];
  let allSections = [];
  let headingObserver = null;

  // Load manifest.json and update footer with dev version
  fetch('/manifest.json', { cache: 'no-store' })
    .then(r => r.ok ? r.json() : null)
    .then(m => {
      if (!m) return;
      const footerMeta = document.getElementById('footer-meta');
      const devV = m.versions?.dev?.version ?? null;
      footerMeta.textContent = devV
        ? `sgraph.ai/dev · site ${m.site?.version ?? 'v0.2.0'} · dev v${devV}`
        : `sgraph.ai/dev · site ${m.site?.version ?? 'v0.2.0'} · status vault 1lfehfjh`;
    })
    .catch(() => {});

  const initialSlug = slugFromPath();
  if (initialSlug) sideNav.setAttribute('active-slug', initialSlug);

  document.addEventListener('nav:loaded', e => {
    const { sections } = e.detail;
    allSections = sections;
    allArticles = sections.flatMap(s =>
      (s.children ?? s.articles ?? []).filter(a => a.content_object_id)
                                      .map(a => ({ ...a, sectionTitle: s.title }))
    );
    buildLandingCards(sections);
    const slug = slugFromPath();
    if (!slug) {
      showLanding();
    } else {
      const matchedSection = sections.find(s => toSlug(s.title) === slug);
      if (matchedSection) showSectionIndex(matchedSection);
    }
  });

  document.addEventListener('nav:select', e => {
    const { title, slug, sectionTitle, content_object_id, render, vault_id, read_key } = e.detail;
    const targetPath = `/en-gb/dev/${slug}/`;
    if (location.pathname !== targetPath) {
      history.pushState({ slug }, '', targetPath);
    }
    setBreadcrumbs('Dev', sectionTitle, title);

    // Special built-in views
    if (content_object_id === '__ci__' || slug === 'ci') {
      showCiView();
      buildNextPrev(slug);
      return;
    }
    // Guard: don't attempt vault load if no object ID
    if (!content_object_id) { showLanding(); return; }

    const effectiveRender = render ?? 'markdown';
    if (effectiveRender === 'json') {
      showJsonBoard(content_object_id, vault_id || VAULT_ID, read_key || READ_KEY, e.detail.schema, title);
    } else {
      showArticle(content_object_id, effectiveRender, vault_id, read_key);
    }
    buildNextPrev(slug);
  });

  document.addEventListener('nav:section', e => {
    const { title, sectionSlug } = e.detail;
    const targetPath = `/en-gb/dev/${sectionSlug}/`;
    if (location.pathname !== targetPath) {
      history.pushState({ sectionSlug }, '', targetPath);
    }
    const section = allSections.find(s => s.title === title);
    if (section) showSectionIndex(section);
  });

  window.addEventListener('popstate', () => {
    const slug = slugFromPath();
    if (!slug) { showLanding(); return; }
    const matchedSection = allSections.find(s => toSlug(s.title) === slug);
    if (matchedSection) { showSectionIndex(matchedSection); return; }
    const btn = sideNav.querySelector(`.sg-side-nav__doc[data-slug="${CSS.escape(slug)}"]`);
    if (btn) btn.click();
    else sideNav.setAttribute('active-slug', slug);
  });

  function showLanding() {
    articleEl.hidden = true;
    articleToc.hidden = true;
    shell.classList.remove('with-toc');
    landing.hidden = false;
  }

  async function showJsonBoard(objectId, vaultId, readKey, schema, title) {
    landing.hidden = true;
    articleEl.hidden = false;
    articleToc.hidden = true;
    shell.classList.remove('with-toc');

    const renderEl = document.getElementById('article-render');
    renderEl.innerHTML = '<div style="padding:2rem 0;color:#888;font-size:.9rem">Loading…</div>';

    try {
      const { importReadKey, readObject } =
        await import('/core/vault-client/v1/v1.2/v1.2.2/sg-vault-client.js');
      const key = await importReadKey(readKey);
      const buf = await readObject('https://send.sgraph.ai', vaultId, objectId, key);
      const text = new TextDecoder().decode(buf);
      const data = JSON.parse(text);
      const effectiveSchema = data.schema ?? schema;
      renderEl.innerHTML = renderJsonBoard(data, effectiveSchema);
      wireKanban(renderEl, data, effectiveSchema);
      // Emit raw content for debug panel
      document.dispatchEvent(new CustomEvent('debug:vault-content',
        { detail: { objectId, text, kind: 'json board' } }));
    } catch (err) {
      renderEl.innerHTML =
        `<div class="sg-article-viewer__error">Failed to load board: ${err.message}</div>`;
      console.error('showJsonBoard:', err);
    }
  }

  // ── CI / GitHub Actions inline view ──────────────────────────────────────
  function showCiView() {
    landing.hidden = true;
    articleEl.hidden = false;
    articleToc.hidden = true;
    shell.classList.remove('with-toc');
    setBreadcrumbs('Dev', 'Tools', 'CI / GitHub Actions');

    const renderEl = document.getElementById('article-render');
    renderEl.innerHTML = `
      <div class="article-viewer" style="max-width:860px">
        <div class="article-body" id="ci-body">
          <h1 style="font-size:1.4rem;margin-bottom:.25rem">CI / GitHub Actions</h1>
          <p style="color:#888;font-size:.85rem;margin-bottom:1.5rem">sgraph-ai/sgraph-ai__website · live run data</p>
          <div id="ci-manifest-strip" style="background:#fafaf9;border:1px solid #e5e5e4;border-radius:8px;padding:1rem 1.25rem;margin-bottom:1.5rem;display:flex;gap:1.5rem;flex-wrap:wrap"></div>
          <div style="display:flex;align-items:center;gap:.75rem;margin-bottom:1.25rem;flex-wrap:wrap">
            <select id="ci-wf-filter" style="font-size:.83rem;padding:5px 10px;border:1px solid #d4d4d2;border-radius:6px;background:#fff">
              <option value="">All workflows</option>
            </select>
            <select id="ci-st-filter" style="font-size:.83rem;padding:5px 10px;border:1px solid #d4d4d2;border-radius:6px;background:#fff">
              <option value="">All statuses</option>
              <option value="success">Success</option>
              <option value="failure">Failure</option>
              <option value="in_progress">In progress</option>
              <option value="cancelled">Cancelled</option>
            </select>
            <button id="ci-refresh" style="display:flex;align-items:center;gap:.4rem;padding:5px 12px;border:1px solid #d4d4d2;border-radius:6px;background:#fff;font-size:.83rem;cursor:pointer">⟳ Refresh</button>
            <span id="ci-last" style="margin-left:auto;font-size:.75rem;color:#aaa"></span>
          </div>
          <div id="ci-runs" style="color:#888;font-size:.88rem;padding:1rem 0">Fetching workflow runs…</div>
        </div>
      </div>`;

    // Load manifest strip
    fetch('/manifest.json',{cache:'no-store'}).then(r=>r.ok?r.json():null).then(m=>{
      if(!m) return;
      const strip = document.getElementById('ci-manifest-strip');
      if(!strip) return;
      const vs = m.versions ?? {};
      strip.innerHTML = Object.entries(vs).map(([,v])=>`
        <div style="flex:1;min-width:120px">
          <div style="font-size:.68rem;color:#aaa;text-transform:uppercase;letter-spacing:.05em">${v.label??''}</div>
          <div style="font-size:.95rem;font-weight:600;font-family:monospace">${v.version??'—'}</div>
          ${v.updated?`<div style="font-size:.72rem;color:#888">${v.updated}</div>`:''}
        </div>`).join('');
    }).catch(()=>{});

    let _runs = [];
    const ciRuns = () => document.getElementById('ci-runs');
    const REPO   = 'sgraph-ai/sgraph-ai__website';

    const fetchRuns = async () => {
      const el = ciRuns(); if(!el) return;
      el.innerHTML = '<span style="color:#888">Fetching…</span>';
      try {
        const r = await fetch(`https://api.github.com/repos/${REPO}/actions/runs?per_page=30`,
          { headers:{'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'} });
        if(!r.ok) throw new Error(`HTTP ${r.status}`);
        const d = await r.json();
        _runs = d.workflow_runs ?? [];
        const wfSel = document.getElementById('ci-wf-filter');
        if(wfSel) {
          const names = [...new Set(_runs.map(r=>r.name))].sort();
          wfSel.innerHTML = '<option value="">All workflows</option>' +
            names.map(n=>`<option value="${n}">${n}</option>`).join('');
        }
        const lastEl = document.getElementById('ci-last');
        if(lastEl) lastEl.textContent = `Fetched ${new Date().toLocaleTimeString()}`;
        renderRuns();
      } catch(err) {
        if(el) el.innerHTML = `<div style="padding:.75rem 1rem;background:#fff0f0;border:1px solid #fecaca;border-radius:6px;color:#dc2626;font-size:.83rem">⚠ ${err.message}</div>`;
      }
    };

    const stateColor = s =>
      s==='success'?'#16a34a':s==='failure'?'#dc2626':s==='in_progress'?'#2563eb':
      s==='cancelled'||s==='skipped'?'#6b7280':'#94a3b8';
    const stateIcon  = s =>
      s==='success'?'✓':s==='failure'?'✗':s==='in_progress'?'⟳':s==='cancelled'?'⊘':'●';
    const fmtDur = secs => secs<60?`${Math.round(secs)}s`:`${Math.floor(secs/60)}m ${Math.round(secs%60)}s`;
    const timeAgo = d => {
      const s=Math.floor((Date.now()-d)/1000);
      return s<60?'just now':s<3600?`${Math.floor(s/60)}m ago`:s<86400?`${Math.floor(s/3600)}h ago`:`${Math.floor(s/86400)}d ago`;
    };
    const renderRuns = () => {
      const el = ciRuns(); if(!el) return;
      const wf = document.getElementById('ci-wf-filter')?.value ?? '';
      const st = document.getElementById('ci-st-filter')?.value ?? '';
      let runs = _runs;
      if(wf) runs = runs.filter(r=>r.name===wf);
      if(st) runs = runs.filter(r=>(r.conclusion??r.status)===st);
      if(!runs.length){ el.innerHTML='<div style="color:#aaa;font-size:.85rem;padding:1rem 0">No matching runs.</div>'; return; }
      const byWf = {};
      runs.forEach(r=>{ (byWf[r.name]||(byWf[r.name]=[])).push(r); });
      el.innerHTML = Object.entries(byWf).map(([wfName,wfRuns])=>`
        <div style="margin-bottom:1.5rem">
          <div style="font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#888;padding-bottom:.4rem;margin-bottom:.5rem;border-bottom:1px solid #e5e5e4">${escH(wfName)}</div>
          ${wfRuns.map(run=>{
            const state = run.conclusion??run.status;
            const color = stateColor(state);
            const start = run.run_started_at?new Date(run.run_started_at):null;
            const upd   = run.updated_at?new Date(run.updated_at):null;
            const dur   = start&&upd?fmtDur((upd-start)/1000):null;
            const commitMsg = (run.head_commit?.message??run.display_title??'').split('\n')[0];
            return `<div onclick="window.open('${escH(run.html_url)}','_blank','noopener')"
                style="display:grid;grid-template-columns:26px 1fr auto;gap:.5rem;align-items:start;
                padding:.7rem .9rem;border:1px solid #e5e5e4;border-radius:7px;margin-bottom:.4rem;
                background:#fff;cursor:pointer;transition:box-shadow .15s"
                onmouseover="this.style.boxShadow='0 2px 8px rgba(0,0,0,.07)'"
                onmouseout="this.style.boxShadow='none'">
              <div style="width:26px;height:26px;border-radius:50%;background:${color}22;color:${color};
                display:flex;align-items:center;justify-content:center;font-size:13px;margin-top:2px">${stateIcon(state)}</div>
              <div>
                <div style="font-weight:600;font-size:.88rem;color:#1a1a1a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:400px">${escH(commitMsg||`Run #${run.run_number}`)}</div>
                <div style="font-size:.75rem;color:#888;margin-top:3px;display:flex;gap:.5rem;flex-wrap:wrap">
                  <code style="background:#f0f9ff;color:#0369a1;padding:1px 5px;border-radius:3px;border:1px solid #bae6fd">${escH(run.head_branch??'')}</code>
                  <code style="color:#aaa">${(run.head_sha??'').slice(0,7)}</code>
                  ${run.actor?.login?`<span>by ${escH(run.actor.login)}</span>`:''}
                  ${start?`<span>${timeAgo(start)}</span>`:''}
                </div>
              </div>
              <div style="text-align:right;flex-shrink:0">
                <span style="display:inline-block;padding:2px 7px;border-radius:9999px;font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;background:${color}22;color:${color};border:1px solid ${color}44">${escH(state??'?')}</span>
                ${dur?`<div style="font-size:.72rem;color:#888;margin-top:3px">${dur}</div>`:''}
              </div>
            </div>`;
          }).join('')}
        </div>`).join('');
    };

    document.getElementById('ci-refresh')?.addEventListener('click', fetchRuns);
    document.getElementById('ci-wf-filter')?.addEventListener('change', renderRuns);
    document.getElementById('ci-st-filter')?.addEventListener('change', renderRuns);
    fetchRuns();
  }

  function renderJsonBoard(data, schema) {
    const STATUS_COLORS = {
      done: '#22c55e', 'in-progress': '#3b82f6', next: '#f59e0b',
      queued: '#94a3b8', blocked: '#ef4444', open: '#ef4444',
      resolved: '#22c55e', released: '#22c55e', planned: '#94a3b8',
      active: '#22c55e', idle: '#94a3b8',
    };
    const badge = s => {
      const color = STATUS_COLORS[s] ?? '#94a3b8';
      return `<span style="display:inline-block;padding:2px 8px;border-radius:9999px;
        font-size:.72rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase;
        background:${color}22;color:${color};border:1px solid ${color}44">${s}</span>`;
    };
    const card = (title, meta, body) => `
      <div style="background:#fafaf9;border:1px solid #e5e5e4;border-radius:8px;
          padding:1rem 1.25rem;margin-bottom:.75rem">
        <div style="display:flex;align-items:center;gap:.75rem;flex-wrap:wrap;margin-bottom:${body?'.5rem':'0'}">
          <span style="font-weight:600;font-size:.95rem">${title}</span>
          ${meta}
        </div>
        ${body ? `<div style="font-size:.85rem;color:#666;margin-top:.25rem">${body}</div>` : ''}
      </div>`;

    if (schema === 'project-workstreams-v1') {
      return renderWorkstreamsKanban(data.workstreams ?? (Array.isArray(data) ? data : []));
    }

    if (schema === 'project-issues-v1') {
      const issues = data.issues ?? (Array.isArray(data) ? data : []);
      return issues.map(i =>
        card(
          `<code style="font-size:.75rem;color:#888">${i.id}</code> ${i.title}`,
          `${badge(i.status ?? 'open')}${i.priority ? badge(i.priority) : ''}${i.owner ? ` <span style="font-size:.8rem;color:#888">${i.owner}</span>` : ''}`,
          i.description ?? ''
        )
      ).join('');
    }

    if (schema === 'project-agents-v1') {
      const agents = data.agents ?? (Array.isArray(data) ? data : []);
      return agents.map(a =>
        card(
          `${a.alias ?? a.id}`,
          `${badge(a.session_status ?? 'idle')}${a.model ? ` <span style="font-size:.8rem;color:#888">${a.model}</span>` : ''}`,
          [a.domain, a.current_task ? `Current task: ${a.current_task}` : ''].filter(Boolean).join(' · ')
        )
      ).join('');
    }

    if (schema === 'project-releases-v1') {
      const releases = data.releases ?? (Array.isArray(data) ? data : []);
      return releases.map(r => `
        <div style="margin-bottom:2rem">
          <h2 style="font-size:1.05rem;font-weight:700;margin:0 0 .75rem;
              display:flex;align-items:center;gap:.75rem">
            ${r.version} ${badge(r.status ?? 'planned')}
            ${r.date ? `<span style="font-size:.8rem;font-weight:400;color:#888">${r.date}</span>` : ''}
          </h2>
          ${(r.tasks ?? []).map(t =>
            `<div style="padding:.4rem 0;border-bottom:1px solid #f0f0ef;font-size:.875rem">
              <code style="font-size:.75rem;color:#888">${t.id}</code> ${t.title}
              ${t.owner ? `<span style="float:right;color:#aaa;font-size:.75rem">${t.owner}</span>` : ''}
            </div>`
          ).join('')}
          ${(r.issues ?? []).map(i =>
            `<div style="padding:.4rem 0;border-bottom:1px solid #f0f0ef;font-size:.875rem">
              <code style="font-size:.75rem;color:#888">${i.id}</code> ${i.title}
            </div>`
          ).join('')}
        </div>`).join('');
    }

    if (schema === 'project-workstreams-v2') {
      const workstreams = data.workstreams ?? [];
      const columns = [
        { key: 'queued',      label: 'Queued',      color: '#94a3b8' },
        { key: 'next',        label: 'Up Next',     color: '#f59e0b' },
        { key: 'in-progress', label: 'In Progress', color: '#3b82f6' },
        { key: 'done',        label: 'Done',         color: '#22c55e' },
      ];
      const allTasks = workstreams.flatMap(ws =>
        (ws.tasks ?? []).map(t => ({ ...t, _ws: ws.title, _color: ws.color ?? '#6366f1' }))
      );
      const colsHtml = columns.map(col => {
        const tasks = allTasks.filter(t =>
          (t.status ?? '').toLowerCase().replace(/\s+/g, '-') === col.key
        );
        if (!tasks.length && col.key === 'next') return '';
        return `
          <div style="flex:1;min-width:160px">
            <div style="display:flex;align-items:center;gap:6px;margin-bottom:.75rem;
                font-size:.75rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:${col.color}">
              <span style="width:8px;height:8px;border-radius:50%;background:${col.color};flex-shrink:0"></span>
              ${col.label}
              <span style="margin-left:auto;background:${col.color}22;color:${col.color};
                  padding:1px 7px;border-radius:9999px;font-size:.7rem">${tasks.length}</span>
            </div>
            ${tasks.map(t => `
              <div style="background:#fafaf9;border:1px solid #e5e5e4;border-left:3px solid ${t._color};
                  border-radius:6px;padding:.6rem .85rem;margin-bottom:.5rem;font-size:.85rem">
                <div style="font-size:.7rem;color:#aaa;margin-bottom:2px">${t._ws}</div>
                <div style="font-weight:500;color:#1a1a1a">${t.task ?? t.title ?? ''}</div>
                ${t.owner ? `<div style="font-size:.72rem;color:#888;margin-top:3px">${t.owner}</div>` : ''}
                ${t.notes ? `<div style="font-size:.75rem;color:#777;margin-top:4px;border-top:1px solid #f0f0ef;padding-top:4px">${t.notes}</div>` : ''}
              </div>`).join('')}
            ${!tasks.length ? `<div style="font-size:.8rem;color:#ccc;padding:.5rem 0">—</div>` : ''}
          </div>`;
      }).filter(Boolean).join('');

      const legend = workstreams.map(ws =>
        `<span style="display:inline-flex;align-items:center;gap:5px;font-size:.78rem;color:#555">
          <span style="width:8px;height:8px;border-radius:50%;background:${ws.color ?? '#6366f1'}"></span>
          ${ws.title}
        </span>`
      ).join('');

      return `
        ${legend ? `<div style="display:flex;flex-wrap:wrap;gap:12px;margin-bottom:1.5rem">${legend}</div>` : ''}
        <div style="display:flex;gap:16px;align-items:flex-start;overflow-x:auto">${colsHtml}</div>`;
    }

    if (schema === 'project-agents-v2') {
      const agents = data.agents ?? [];
      return agents.map(a => {
        const statusColor = STATUS_COLORS[a.session_status?.toLowerCase()] ?? '#94a3b8';
        return card(
          `${a.alias ?? ''}`,
          `${badge(a.session_status ?? 'idle')}${a.model ? ` <span style="font-size:.8rem;color:#888">${a.model}</span>` : ''}`,
          [a.role, a.location].filter(Boolean).join(' · ')
        );
      }).join('');
    }

    // Generic fallback
    const topKey = Object.keys(data).find(k => Array.isArray(data[k]));
    if (!topKey) return `<pre style="padding:2rem;overflow:auto;font-size:.8rem">${JSON.stringify(data, null, 2)}</pre>`;
    return data[topKey].map(item =>
      card(
        item.title ?? item.name ?? item.id ?? JSON.stringify(item).slice(0, 60),
        item.status ? badge(item.status) : '',
        item.description ?? ''
      )
    ).join('');
  }

  function renderWorkstreamsKanban(workstreams) {
    const COLS = [
      { key: 'queued',      label: 'Queued',      color: '#94a3b8' },
      { key: 'next',        label: 'Up Next',     color: '#f59e0b' },
      { key: 'in-progress', label: 'In Progress', color: '#3b82f6' },
      { key: 'done',        label: 'Done',        color: '#22c55e' },
    ];
    const deriveStatus = ws => {
      if (ws.status) return ws.status;
      const tasks = ws.tasks ?? [];
      if (!tasks.length) return 'queued';
      if (tasks.every(t => t.status === 'done')) return 'done';
      if (tasks.some(t => t.status === 'in-progress')) return 'in-progress';
      if (tasks.some(t => t.status === 'next')) return 'next';
      return 'queued';
    };

    const colsHtml = COLS.map(col => {
      const wsList = workstreams.filter(ws => deriveStatus(ws) === col.key);
      const cardsHtml = wsList.map(ws => {
        const tasks  = ws.tasks ?? [];
        const total  = tasks.length;
        const counts = { queued: 0, next: 0, 'in-progress': 0, done: 0 };
        tasks.forEach(t => { const s = t.status ?? 'queued'; counts[s] = (counts[s] ?? 0) + 1; });
        const donePct = total ? Math.round((counts.done / total) * 100) : 0;
        const color   = ws.color ?? '#6366f1';
        return `
          <div data-ws-id="${escH(ws.id)}" style="
              background:#fafaf9;border:1px solid #e5e5e4;border-left:3px solid ${color};
              border-radius:6px;padding:.75rem 1rem;margin-bottom:.5rem;cursor:pointer;
              transition:box-shadow .15s"
            onmouseover="this.style.boxShadow='0 2px 8px rgba(0,0,0,.08)'"
            onmouseout="this.style.boxShadow='none'">
            <div style="font-weight:600;font-size:.9rem;color:#1a1a1a;margin-bottom:.5rem">${escH(ws.title ?? ws.id)}</div>
            <div style="background:#e5e5e4;border-radius:9999px;height:4px;margin-bottom:.5rem;overflow:hidden">
              <div style="background:${color};height:100%;width:${donePct}%;border-radius:9999px"></div>
            </div>
            <div style="display:flex;gap:.35rem;flex-wrap:wrap;font-size:.7rem">
              ${counts.queued      ? `<span style="background:#94a3b822;color:#64748b;padding:1px 6px;border-radius:9999px">Q&nbsp;${counts.queued}</span>` : ''}
              ${counts.next        ? `<span style="background:#f59e0b22;color:#b45309;padding:1px 6px;border-radius:9999px">N&nbsp;${counts.next}</span>` : ''}
              ${counts['in-progress'] ? `<span style="background:#3b82f622;color:#1d4ed8;padding:1px 6px;border-radius:9999px">P&nbsp;${counts['in-progress']}</span>` : ''}
              ${counts.done        ? `<span style="background:#22c55e22;color:#15803d;padding:1px 6px;border-radius:9999px">D&nbsp;${counts.done}</span>` : ''}
              ${!total ? '<span style="color:#ccc">No tasks</span>' : ''}
            </div>
          </div>`;
      }).join('');

      return `
        <div style="flex:1;min-width:180px">
          <div style="display:flex;align-items:center;gap:6px;margin-bottom:.75rem;
              font-size:.73rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:${col.color}">
            <span style="width:8px;height:8px;border-radius:50%;background:${col.color};flex-shrink:0"></span>
            ${col.label}
            <span style="margin-left:auto;background:${col.color}22;color:${col.color};
                padding:1px 7px;border-radius:9999px;font-size:.68rem">${wsList.length}</span>
          </div>
          ${cardsHtml || '<div style="font-size:.8rem;color:#ccc;padding:.5rem 0">—</div>'}
        </div>`;
    }).join('');

    return `<div style="display:flex;gap:1rem;align-items:flex-start;overflow-x:auto">${colsHtml}</div>`;
  }

  function renderWorkstreamDetail(ws) {
    const COLS = [
      { key: 'queued',      label: 'Queued',      color: '#94a3b8' },
      { key: 'next',        label: 'Up Next',     color: '#f59e0b' },
      { key: 'in-progress', label: 'In Progress', color: '#3b82f6' },
      { key: 'done',        label: 'Done',        color: '#22c55e' },
    ];
    const color = ws.color ?? '#6366f1';
    const tasks = ws.tasks ?? [];

    const colsHtml = COLS.map(col => {
      const colTasks = tasks.filter(t => (t.status ?? 'queued') === col.key);
      return `
        <div style="flex:1;min-width:160px">
          <div style="display:flex;align-items:center;gap:6px;margin-bottom:.75rem;
              font-size:.73rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:${col.color}">
            <span style="width:8px;height:8px;border-radius:50%;background:${col.color};flex-shrink:0"></span>
            ${col.label}
            <span style="margin-left:auto;background:${col.color}22;color:${col.color};
                padding:1px 7px;border-radius:9999px;font-size:.68rem">${colTasks.length}</span>
          </div>
          ${colTasks.map(t => `
            <div style="background:#fafaf9;border:1px solid #e5e5e4;border-left:3px solid ${color};
                border-radius:6px;padding:.6rem .85rem;margin-bottom:.5rem;font-size:.85rem">
              <div style="font-size:.7rem;color:#aaa;margin-bottom:2px;font-family:monospace">${escH(t.id ?? '')}</div>
              <div style="font-weight:500;color:#1a1a1a">${escH(t.title ?? t.task ?? '')}</div>
              ${t.owner ? `<div style="font-size:.72rem;color:#888;margin-top:3px">${escH(t.owner)}</div>` : ''}
              ${t.description ? `<div style="font-size:.75rem;color:#777;margin-top:4px;border-top:1px solid #f0f0ef;padding-top:4px">${escH(t.description)}</div>` : ''}
            </div>`).join('')}
          ${!colTasks.length ? '<div style="font-size:.8rem;color:#ccc;padding:.5rem 0">—</div>' : ''}
        </div>`;
    }).join('');

    return `
      <div>
        <button data-back="workstreams" style="display:inline-flex;align-items:center;gap:.4rem;
            font-size:.83rem;color:#555;background:none;border:1px solid #e5e5e4;border-radius:6px;
            padding:4px 10px;cursor:pointer;margin-bottom:1.25rem">
          ← All Workstreams
        </button>
        <h1 style="font-size:1.15rem;font-weight:700;margin:0 0 .25rem;display:flex;align-items:center;gap:.6rem">
          <span style="width:10px;height:10px;border-radius:50%;background:${color};flex-shrink:0"></span>
          ${escH(ws.title ?? ws.id)}
        </h1>
        ${ws.description ? `<p style="color:#888;font-size:.88rem;margin:0 0 1.5rem">${escH(ws.description)}</p>` : '<div style="margin-bottom:1.5rem"></div>'}
        <div style="display:flex;gap:1rem;align-items:flex-start;overflow-x:auto">${colsHtml}</div>
      </div>`;
  }

  function wireKanban(renderEl, data, schema) {
    if (schema !== 'project-workstreams-v1') return;
    const workstreams = data.workstreams ?? (Array.isArray(data) ? data : []);
    renderEl.querySelectorAll('[data-ws-id]').forEach(card => {
      card.addEventListener('click', () => {
        const ws = workstreams.find(w => w.id === card.dataset.wsId);
        if (!ws) return;
        renderEl.innerHTML = renderWorkstreamDetail(ws);
        renderEl.querySelector('[data-back="workstreams"]')?.addEventListener('click', () => {
          renderEl.innerHTML = renderWorkstreamsKanban(workstreams);
          wireKanban(renderEl, data, schema);
        });
      });
    });
  }

  function showSectionIndex(section) {
    landing.hidden = true;
    articleToc.hidden = true;
    shell.classList.remove('with-toc');
    articleEl.hidden = false;

    setBreadcrumbs('Dev', section.title, null);

    const articles = section.children ?? section.articles ?? [];
    document.getElementById('article-render').innerHTML = `
      <div class="article-viewer">
        <div class="article-body">
          <h1>${section.title}</h1>
          <ul class="section-index-list">
            ${articles.map(a => `
              <li class="section-index-list__item">
                <button class="section-index-list__link" data-slug="${a.slug ?? ''}">
                  ${a.title}
                </button>
              </li>`).join('')}
          </ul>
        </div>
      </div>`;

    document.getElementById('next-prev').innerHTML = '';

    document.querySelectorAll('.section-index-list__link').forEach(btn => {
      btn.addEventListener('click', () => {
        const slug = btn.dataset.slug;
        if (!slug) return;
        sideNav.querySelector(`.sg-side-nav__doc[data-slug="${CSS.escape(slug)}"]`)?.click();
      });
    });
  }

  function showArticle(objectId, render, vaultId, readKey) {
    landing.hidden = true;
    articleEl.hidden = false;

    const renderEl = document.getElementById('article-render');
    renderEl.innerHTML = '';

    const el = document.createElement('sg-article-viewer');
    el.setAttribute('vault-id',  vaultId  || VAULT_ID);
    el.setAttribute('read-key',  readKey  || READ_KEY);
    el.setAttribute('object-id', objectId);
    el.setAttribute('render',    render   || 'markdown');
    renderEl.appendChild(el);

    // Build TOC once content renders
    if (headingObserver) headingObserver.disconnect();
    articleToc.hidden = true;
    shell.classList.remove('with-toc');
    document.getElementById('toc-list').innerHTML = '';

    headingObserver = new MutationObserver(() => {
      clearTimeout(headingObserver._t);
      headingObserver._t = setTimeout(() => buildToc(renderEl), 150);
    });
    headingObserver.observe(renderEl, { childList: true, subtree: true });
  }

  function setBreadcrumbs(site, section, article) {
    const siteHref    = '/en-gb/dev/';
    const sectionHref = section ? `/en-gb/dev/${toSlug(section)}/` : null;
    const el = document.getElementById('article-crumbs');
    const parts = [site, section, article].filter(Boolean);
    el.innerHTML = parts.map((p, i) => {
      if (i === 0) return `<a class="sub-site__crumbs-link" href="${siteHref}">${p}</a><span class="sub-site__crumbs-sep">/</span>`;
      if (i === 1 && parts.length > 2) return `<a class="sub-site__crumbs-link" href="${sectionHref}">${p}</a><span class="sub-site__crumbs-sep">/</span>`;
      if (i < parts.length - 1) return `<span>${p}</span><span class="sub-site__crumbs-sep">/</span>`;
      return `<span class="sub-site__crumbs-here">${p}</span>`;
    }).join('');
  }

  function buildToc(container) {
    const headings = Array.from(container.querySelectorAll('h2, h3'));
    if (headings.length < 2) return;

    headings.forEach((h, i) => { if (!h.id) h.id = `h-${i}`; });

    const tocList = document.getElementById('toc-list');
    tocList.innerHTML = headings.map(h => `
      <li class="${h.tagName === 'H3' ? 'h3' : ''}">
        <a class="sub-site__toc-link" href="#${h.id}">${h.textContent}</a>
      </li>`).join('');

    shell.classList.add('with-toc');
    articleToc.hidden = false;

    const links = Array.from(tocList.querySelectorAll('.sub-site__toc-link'));
    const io = new IntersectionObserver(entries => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          links.forEach(l => l.classList.remove('active'));
          tocList.querySelector(`a[href="#${entry.target.id}"]`)
                 ?.classList.add('active');
        }
      });
    }, { rootMargin: '-15% 0px -70% 0px' });
    headings.forEach(h => io.observe(h));
  }

  function buildLandingCards(sections) {
    const container = document.getElementById('landing-sections');
    container.innerHTML = sections.map(section => {
      const articles = section.children ?? section.articles ?? [];
      const shown    = articles.slice(0, 4);
      const overflow = articles.length - shown.length;
      return `
        <div class="section-card">
          <div class="section-card__header">
            <button class="section-card__title" data-section="${section.title}">${section.title}</button>
            <span class="section-card__count">${articles.length}</span>
          </div>
          <ul class="section-card__articles">
            ${shown.map(a => a.href
              ? `<li><a class="section-card__article" href="${a.href}">${a.title}</a></li>`
              : `<li><button class="section-card__article"
                             data-slug="${a.slug ?? ''}">${a.title}</button></li>`
            ).join('')}
            ${overflow > 0 ? `<li><span class="section-card__more">+${overflow} more</span></li>` : ''}
          </ul>
        </div>`;
    }).join('');

    container.querySelectorAll('.section-card__title[data-section]').forEach(btn => {
      btn.addEventListener('click', () => {
        const sectionTitle = btn.dataset.section;
        const sectionSlug  = toSlug(sectionTitle);
        history.pushState({ sectionSlug }, '', `/en-gb/dev/${sectionSlug}/`);
        const section = allSections.find(s => s.title === sectionTitle);
        if (section) showSectionIndex(section);
      });
    });

    container.querySelectorAll('.section-card__article[data-slug]').forEach(btn => {
      btn.addEventListener('click', () => {
        const slug = btn.dataset.slug;
        if (!slug) return;
        sideNav.querySelector(`.sg-side-nav__doc[data-slug="${CSS.escape(slug)}"]`)?.click();
      });
    });
  }

  function buildNextPrev(currentSlug) {
    const container = document.getElementById('next-prev');
    const idx  = allArticles.findIndex(a => a.slug === currentSlug);
    const prev = idx > 0 ? allArticles[idx - 1] : null;
    const next = idx >= 0 && idx < allArticles.length - 1 ? allArticles[idx + 1] : null;

    if (!prev && !next) { container.innerHTML = ''; return; }

    container.innerHTML = `
      <div class="sub-site__nav-card sub-site__nav-card--prev${prev ? '' : ' sub-site__nav-card--empty'}"
           ${prev ? '' : 'aria-hidden="true"'}>
        ${prev ? `<div class="sub-site__nav-label">← Previous</div>
                  <div class="sub-site__nav-title">${prev.title}</div>` : ''}
      </div>
      <div class="sub-site__nav-card sub-site__nav-card--next${next ? '' : ' sub-site__nav-card--empty'}"
           ${next ? '' : 'aria-hidden="true"'}>
        ${next ? `<div class="sub-site__nav-label">Next →</div>
                  <div class="sub-site__nav-title">${next.title}</div>` : ''}
      </div>`;

    if (prev) {
      container.querySelector('.sub-site__nav-card--prev')
               .addEventListener('click', () => {
        sideNav.querySelector(`.sg-side-nav__doc[data-slug="${CSS.escape(prev.slug)}"]`)?.click();
      });
    }
    if (next) {
      container.querySelector('.sub-site__nav-card--next')
               .addEventListener('click', () => {
        sideNav.querySelector(`.sg-side-nav__doc[data-slug="${CSS.escape(next.slug)}"]`)?.click();
      });
    }
  }
</script>

  window.addEventListener('pageshow', e => { if (e.persisted) location.reload(); });
