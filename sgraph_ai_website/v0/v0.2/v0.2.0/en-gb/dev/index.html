<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dev — sgraph.ai</title>
  <base href="/en-gb/dev/">
  <link rel="icon"       href="../../_common/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap">
  <link rel="stylesheet" href="../../_common/fonts/fonts.css">
  <link rel="stylesheet" href="../../_common/css/style.css">

  <script type="importmap">
  {
    "imports": {
      "/core/vault-client/v1/v1.2/v1.2.2/sg-vault-client.js":
          "https://dev.tools.sgraph.ai/core/vault-client/v1/v1.2/v1.2.2/sg-vault-client.js"
    }
  }
  </script>

  <script type="module" src="../../_common/js/components/sg-article-viewer/v0/v0.1/v0.1.0/sg-article-viewer.js"></script>
</head>
<body class="sub-site-page">

<!-- ═══ PERSISTENT HEADER ════════════════════════════════════ -->
<sg-site-header site="Send"></sg-site-header>

<!-- Gap between dark site header and light sub-site shell -->
<div class="sub-site-gap"></div>

<!-- ═══ DEV SUB-SITE BAND ════════════════════════════════════ -->
<!--
  Vault: bf31a13c78c9  |  nav object: obj-cas-imm-4cb7740ea1f2 (dev nav v2.1)
-->
<sg-sub-nav
  site-title="Dev"
  site-description="Developer documentation — the two-agent operating model, Email-FS protocol, vault architecture, and agent onboarding guides."
  vault-id="bf31a13c78c9"
  read-key="s68J93Gx5pzmP4FGo682Ns3JQ0aKdtSVKCjQKtSS_GA"
  nav-object-id="obj-cas-imm-23a4cac1cd36">
</sg-sub-nav>

<!-- ═══ THREE-COLUMN SHELL ════════════════════════════════════ -->
<!--
  Col 1: sg-side-nav (sticky file-tree)
  Col 2: landing page OR article content
  Col 3: article TOC (hidden on landing, shown with .with-toc class when article has headings)
  Non-SPA sub-pages (vault-peek, workstreams, agents, decisions) have href in the nav
  JSON so they render as <a> tags and navigate directly without firing nav:select.
-->
<div class="sub-site" id="sub-site-shell">

  <sg-side-nav
    vault-id="bf31a13c78c9"
    read-key="s68J93Gx5pzmP4FGo682Ns3JQ0aKdtSVKCjQKtSS_GA"
    nav-object-id="obj-cas-imm-23a4cac1cd36"
    tree-label="Dev"
    version="v0.2.0"
    extra-links='[{"section":"Tools","title":"Open Vaults Directory","href":"/en-gb/dev/vaults/","slug":"vaults"},{"section":"Status","title":"Workstreams","slug":"status/workstreams","object_id":"obj-cas-imm-32aa32595ec4","vault_id":"1lfehfjh","read_key":"gYfzgJ5mlhn4pMgSdGcB1oASjETpPB7jVhaF0QQ3uUs","render":"json"},{"section":"Status","title":"Issues","slug":"status/issues","object_id":"obj-cas-imm-da66557cad10","vault_id":"1lfehfjh","read_key":"gYfzgJ5mlhn4pMgSdGcB1oASjETpPB7jVhaF0QQ3uUs","render":"json"},{"section":"Status","title":"Agents","slug":"status/agents","object_id":"obj-cas-imm-652a31e21300","vault_id":"1lfehfjh","read_key":"gYfzgJ5mlhn4pMgSdGcB1oASjETpPB7jVhaF0QQ3uUs","render":"json"}]'
    home-href="/en-gb/dev/"
    auto-select>
  </sg-side-nav>

  <!-- Landing page — shown at /en-gb/dev/ (no article selected) -->
  <div class="sub-site__landing" id="landing" hidden>
    <p class="sub-site__landing-eyebrow">sgraph.ai / Dev</p>
    <h1 class="sub-site__landing-title">Dev</h1>
    <p class="sub-site__landing-desc">Developer documentation — the two-agent operating model, Email-FS protocol, vault architecture, and agent onboarding guides.</p>
    <div class="sub-site__section-cards" id="landing-sections"></div>
  </div>

  <!-- Article content — shown when an article is selected -->
  <div class="sub-site__content" id="article-content" hidden>
    <div class="sub-site__crumbs" id="article-crumbs"></div>
    <div id="article-render"></div>
    <div class="sub-site__next-prev" id="next-prev"></div>
  </div>

  <!-- Right TOC — built from rendered article headings, hidden until populated -->
  <div class="sub-site__toc" id="article-toc" hidden>
    <div class="sub-site__toc-label">On this page</div>
    <ul class="sub-site__toc-list" id="toc-list"></ul>
  </div>

</div>

<footer class="sub-site-footer">
  <span class="sub-site-footer__copy">© 2026 SGraph AI Ltd.</span>
  <span class="sub-site-footer__meta">sgraph.ai/dev · v0.2.0</span>
</footer>

<script type="module">
  const VAULT_ID = 'bf31a13c78c9';
  const READ_KEY = 's68J93Gx5pzmP4FGo682Ns3JQ0aKdtSVKCjQKtSS_GA';

  function slugFromPath() {
    const segments = location.pathname.split('/').filter(Boolean);
    return segments.length > 2 ? segments.slice(2).join('/') : '';
  }

  function toSlug(title) {
    return title.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/, '');
  }

  const shell      = document.getElementById('sub-site-shell');
  const sideNav    = document.querySelector('sg-side-nav');
  const landing    = document.getElementById('landing');
  const articleEl  = document.getElementById('article-content');
  const articleToc = document.getElementById('article-toc');

  let allArticles = [];
  let allSections = [];
  let headingObserver = null;

  const initialSlug = slugFromPath();
  if (initialSlug) sideNav.setAttribute('active-slug', initialSlug);

  document.addEventListener('nav:loaded', e => {
    const { sections } = e.detail;
    allSections = sections;
    allArticles = sections.flatMap(s =>
      (s.articles ?? []).filter(a => a.content_object_id)
                        .map(a => ({ ...a, sectionTitle: s.title }))
    );
    buildLandingCards(sections);
    const slug = slugFromPath();
    if (!slug) {
      showLanding();
    } else {
      const matchedSection = sections.find(s => toSlug(s.title) === slug);
      if (matchedSection) showSectionIndex(matchedSection);
    }
  });

  document.addEventListener('nav:select', e => {
    const { title, slug, sectionTitle, content_object_id, render, vault_id, read_key } = e.detail;
    const targetPath = `/en-gb/dev/${slug}/`;
    if (location.pathname !== targetPath) {
      history.pushState({ slug }, '', targetPath);
    }
    setBreadcrumbs('Dev', sectionTitle, title);
    showArticle(content_object_id, render ?? 'markdown', vault_id, read_key);
    buildNextPrev(slug);
  });

  document.addEventListener('nav:section', e => {
    const { title, sectionSlug } = e.detail;
    const targetPath = `/en-gb/dev/${sectionSlug}/`;
    if (location.pathname !== targetPath) {
      history.pushState({ sectionSlug }, '', targetPath);
    }
    const section = allSections.find(s => s.title === title);
    if (section) showSectionIndex(section);
  });

  window.addEventListener('popstate', () => {
    const slug = slugFromPath();
    if (!slug) { showLanding(); return; }
    const matchedSection = allSections.find(s => toSlug(s.title) === slug);
    if (matchedSection) { showSectionIndex(matchedSection); return; }
    const btn = sideNav.querySelector(`.sg-side-nav__doc[data-slug="${CSS.escape(slug)}"]`);
    if (btn) btn.click();
    else sideNav.setAttribute('active-slug', slug);
  });

  function showLanding() {
    articleEl.hidden = true;
    articleToc.hidden = true;
    shell.classList.remove('with-toc');
    landing.hidden = false;
  }

  function showSectionIndex(section) {
    landing.hidden = true;
    articleToc.hidden = true;
    shell.classList.remove('with-toc');
    articleEl.hidden = false;

    setBreadcrumbs('Dev', section.title, null);

    const articles = section.articles ?? [];
    document.getElementById('article-render').innerHTML = `
      <div class="article-viewer">
        <div class="article-body">
          <h1>${section.title}</h1>
          <ul class="section-index-list">
            ${articles.map(a => `
              <li class="section-index-list__item">
                <button class="section-index-list__link" data-slug="${a.slug ?? ''}">
                  ${a.title}
                </button>
              </li>`).join('')}
          </ul>
        </div>
      </div>`;

    document.getElementById('next-prev').innerHTML = '';

    document.querySelectorAll('.section-index-list__link').forEach(btn => {
      btn.addEventListener('click', () => {
        const slug = btn.dataset.slug;
        if (!slug) return;
        sideNav.querySelector(`.sg-side-nav__doc[data-slug="${CSS.escape(slug)}"]`)?.click();
      });
    });
  }

  function showArticle(objectId, render, vaultId, readKey) {
    landing.hidden = true;
    articleEl.hidden = false;

    const renderEl = document.getElementById('article-render');
    renderEl.innerHTML = '';

    const el = document.createElement('sg-article-viewer');
    el.setAttribute('vault-id',  vaultId  || VAULT_ID);
    el.setAttribute('read-key',  readKey  || READ_KEY);
    el.setAttribute('object-id', objectId);
    el.setAttribute('render',    render   || 'markdown');
    renderEl.appendChild(el);

    // Build TOC once content renders
    if (headingObserver) headingObserver.disconnect();
    articleToc.hidden = true;
    shell.classList.remove('with-toc');
    document.getElementById('toc-list').innerHTML = '';

    headingObserver = new MutationObserver(() => {
      clearTimeout(headingObserver._t);
      headingObserver._t = setTimeout(() => buildToc(renderEl), 150);
    });
    headingObserver.observe(renderEl, { childList: true, subtree: true });
  }

  function setBreadcrumbs(site, section, article) {
    const siteHref    = '/en-gb/dev/';
    const sectionHref = section ? `/en-gb/dev/${toSlug(section)}/` : null;
    const el = document.getElementById('article-crumbs');
    const parts = [site, section, article].filter(Boolean);
    el.innerHTML = parts.map((p, i) => {
      if (i === 0) return `<a class="sub-site__crumbs-link" href="${siteHref}">${p}</a><span class="sub-site__crumbs-sep">/</span>`;
      if (i === 1 && parts.length > 2) return `<a class="sub-site__crumbs-link" href="${sectionHref}">${p}</a><span class="sub-site__crumbs-sep">/</span>`;
      if (i < parts.length - 1) return `<span>${p}</span><span class="sub-site__crumbs-sep">/</span>`;
      return `<span class="sub-site__crumbs-here">${p}</span>`;
    }).join('');
  }

  function buildToc(container) {
    const headings = Array.from(container.querySelectorAll('h2, h3'));
    if (headings.length < 2) return;

    headings.forEach((h, i) => { if (!h.id) h.id = `h-${i}`; });

    const tocList = document.getElementById('toc-list');
    tocList.innerHTML = headings.map(h => `
      <li class="${h.tagName === 'H3' ? 'h3' : ''}">
        <a class="sub-site__toc-link" href="#${h.id}">${h.textContent}</a>
      </li>`).join('');

    shell.classList.add('with-toc');
    articleToc.hidden = false;

    const links = Array.from(tocList.querySelectorAll('.sub-site__toc-link'));
    const io = new IntersectionObserver(entries => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          links.forEach(l => l.classList.remove('active'));
          tocList.querySelector(`a[href="#${entry.target.id}"]`)
                 ?.classList.add('active');
        }
      });
    }, { rootMargin: '-15% 0px -70% 0px' });
    headings.forEach(h => io.observe(h));
  }

  function buildLandingCards(sections) {
    const container = document.getElementById('landing-sections');
    container.innerHTML = sections.map(section => {
      const articles = section.articles ?? [];
      const shown    = articles.slice(0, 4);
      const overflow = articles.length - shown.length;
      return `
        <div class="section-card">
          <div class="section-card__header">
            <button class="section-card__title" data-section="${section.title}">${section.title}</button>
            <span class="section-card__count">${articles.length}</span>
          </div>
          <ul class="section-card__articles">
            ${shown.map(a => a.href
              ? `<li><a class="section-card__article" href="${a.href}">${a.title}</a></li>`
              : `<li><button class="section-card__article"
                             data-slug="${a.slug ?? ''}">${a.title}</button></li>`
            ).join('')}
            ${overflow > 0 ? `<li><span class="section-card__more">+${overflow} more</span></li>` : ''}
          </ul>
        </div>`;
    }).join('');

    container.querySelectorAll('.section-card__title[data-section]').forEach(btn => {
      btn.addEventListener('click', () => {
        const sectionTitle = btn.dataset.section;
        const sectionSlug  = toSlug(sectionTitle);
        history.pushState({ sectionSlug }, '', `/en-gb/dev/${sectionSlug}/`);
        const section = allSections.find(s => s.title === sectionTitle);
        if (section) showSectionIndex(section);
      });
    });

    container.querySelectorAll('.section-card__article[data-slug]').forEach(btn => {
      btn.addEventListener('click', () => {
        const slug = btn.dataset.slug;
        if (!slug) return;
        sideNav.querySelector(`.sg-side-nav__doc[data-slug="${CSS.escape(slug)}"]`)?.click();
      });
    });
  }

  function buildNextPrev(currentSlug) {
    const container = document.getElementById('next-prev');
    const idx  = allArticles.findIndex(a => a.slug === currentSlug);
    const prev = idx > 0 ? allArticles[idx - 1] : null;
    const next = idx >= 0 && idx < allArticles.length - 1 ? allArticles[idx + 1] : null;

    if (!prev && !next) { container.innerHTML = ''; return; }

    container.innerHTML = `
      <div class="sub-site__nav-card sub-site__nav-card--prev${prev ? '' : ' sub-site__nav-card--empty'}"
           ${prev ? '' : 'aria-hidden="true"'}>
        ${prev ? `<div class="sub-site__nav-label">← Previous</div>
                  <div class="sub-site__nav-title">${prev.title}</div>` : ''}
      </div>
      <div class="sub-site__nav-card sub-site__nav-card--next${next ? '' : ' sub-site__nav-card--empty'}"
           ${next ? '' : 'aria-hidden="true"'}>
        ${next ? `<div class="sub-site__nav-label">Next →</div>
                  <div class="sub-site__nav-title">${next.title}</div>` : ''}
      </div>`;

    if (prev) {
      container.querySelector('.sub-site__nav-card--prev')
               .addEventListener('click', () => {
        sideNav.querySelector(`.sg-side-nav__doc[data-slug="${CSS.escape(prev.slug)}"]`)?.click();
      });
    }
    if (next) {
      container.querySelector('.sub-site__nav-card--next')
               .addEventListener('click', () => {
        sideNav.querySelector(`.sg-side-nav__doc[data-slug="${CSS.escape(next.slug)}"]`)?.click();
      });
    }
  }
</script>

<script src="../../_common/js/nav.js"></script>
<script type="module" src="../../_common/js/components/sg-site-header/v1/v1.0/v1.0.6/sg-site-header.js"></script>
<script type="module" src="../../_common/js/components/sg-sub-nav/v0/v0.1/v0.1.0/sg-sub-nav.js"></script>
<script type="module" src="../../_common/js/components/sg-side-nav/v0/v0.1/v0.1.0/sg-side-nav.js"></script>

</body>
</html>
